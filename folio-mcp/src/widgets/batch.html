<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 0; padding: 12px; }
  h3 { margin: 14px 0 6px; font: 600 13px/1.4 system-ui, sans-serif; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 8px; }
  th, td { text-align: left; padding: 4px 10px; border-bottom: 1px solid rgba(128,128,128,.25); vertical-align: top; }
  th { font: 600 12px/1.4 system-ui, sans-serif; opacity: .7; }
  .empty { opacity: .55; padding: 12px; }
  pre { white-space: pre-wrap; margin: 0; }
</style>
</head>
<body>
<div id="root"><div class="empty">Waiting for results…</div></div>
<script>
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m];});}
  function kv(o){return Object.keys(o||{}).map(function(k){return esc(k)+"="+esc(o[k]);}).join(", ");}
  function send(msg){window.parent.postMessage(msg,"*");}
  function reportSize(){
    var h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight,1);
    var w=Math.max(document.body.scrollWidth,document.documentElement.scrollWidth,1);
    send({jsonrpc:"2.0",method:"ui/notifications/size-changed",params:{width:w,height:h}});
  }
  var ready=false;
  function announceReady(){ if(ready) return; ready=true; send({jsonrpc:"2.0",method:"ui/notifications/initialized"}); reportSize(); }
  function render(sc){
    var root=document.getElementById("root");
    if(!sc||!Array.isArray(sc.runs)){root.innerHTML='<div class="empty">No runs to display.</div>';reportSize();return;}
    var html="";
    if(Array.isArray(sc.comparison)&&sc.comparison.length){
      html+="<h3>Comparison"+(sc.compareField?(" — "+esc(sc.compareField)):"")+"</h3>";
      html+="<table><thead><tr><th>#</th><th>variables</th><th>value</th></tr></thead><tbody>";
      sc.comparison.forEach(function(r){html+="<tr><td>"+esc(r.index)+"</td><td>"+kv(r.variables)+"</td><td>"+esc(r.value)+"</td></tr>";});
      html+="</tbody></table>";
    }
    html+="<h3>Runs</h3><table><thead><tr><th>#</th><th>variables</th><th>values</th></tr></thead><tbody>";
    sc.runs.forEach(function(r){html+="<tr><td>"+esc(r.index)+"</td><td>"+kv(r.variables)+"</td><td>"+kv(r.values)+"</td></tr>";});
    html+="</tbody></table>";
    root.innerHTML=html;
    reportSize();
  }
  // First "text" content item of the CallToolResult (the markdown summary).
  function extractMarkdown(p){
    var lists=[p.content,p.result&&p.result.content,p.toolResult&&p.toolResult.content];
    for(var i=0;i<lists.length;i++){
      var c=lists[i];
      if(Array.isArray(c)){
        for(var j=0;j<c.length;j++){ if(c[j]&&c[j].type==="text"&&typeof c[j].text==="string") return c[j].text; }
      }
    }
    return "";
  }
  window.addEventListener("message",function(ev){
    var m=ev.data||{};
    // The only request we send is ui/initialize, so any JSON-RPC response —
    // result OR error — means the host answered -> announce readiness.
    if(m && m.method===undefined && (m.result!==undefined||m.error!==undefined)){ announceReady(); return; }
    var meth=(m&&m.method)||"";
    if((meth==="ui/notifications/tool-result"||meth.indexOf("tool-result")>=0)&&m.params){
      var p=m.params;
      var sc=p.structuredContent||(p.result&&p.result.structuredContent)||(p.toolResult&&p.toolResult.structuredContent)||p;
      // Fallback when the host strips structuredContent: show the markdown
      // summary verbatim rather than the empty state.
      if(!sc||!Array.isArray(sc.runs)){
        var md=extractMarkdown(p);
        if(md){document.getElementById("root").innerHTML="<pre>"+esc(md)+"</pre>";reportSize();return;}
      }
      render(sc);
    }
  });
  // MCP Apps handshake (SEP-1865 2026-01-26): apps identify with appInfo (the
  // clientInfo shape is schema-invalid and rejected by Claude web/Desktop).
  send({jsonrpc:"2.0",id:1,method:"ui/initialize",params:{protocolVersion:"2026-01-26",appInfo:{name:"folio-batch",version:"1"},appCapabilities:{}}});
  try{ new ResizeObserver(function(){reportSize();}).observe(document.body); }catch(e){}
  reportSize();
  setTimeout(announceReady,1000);
</script>
</body>
</html>
