<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 0; padding: 12px; }
  h3 { margin: 16px 0 6px; font: 600 13px/1.4 system-ui, sans-serif; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 8px; }
  th, td { text-align: left; padding: 4px 10px; border-bottom: 1px solid rgba(128,128,128,.25); vertical-align: top; }
  th { font: 600 12px/1.4 system-ui, sans-serif; opacity: .7; }
  td.result { font-weight: 600; }
  tr.err td { background: rgba(220,40,40,.12); }
  td.result.err { color: #c0392b; }
  .empty { opacity: .55; padding: 12px; }
</style>
</head>
<body>
<div id="root"><div class="empty">Waiting for results…</div></div>
<script>
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m];});}
  function send(msg){window.parent.postMessage(msg,"*");}
  // Flexible-dimension Views must report content size or the host leaves the
  // iframe at ~zero height. Report on load, after render, and via ResizeObserver.
  function reportSize(){
    var h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight,1);
    var w=Math.max(document.body.scrollWidth,document.documentElement.scrollWidth,1);
    send({jsonrpc:"2.0",method:"ui/notifications/size-changed",params:{width:w,height:h}});
  }
  var ready=false;
  function announceReady(){ if(ready) return; ready=true; send({jsonrpc:"2.0",method:"ui/notifications/initialized"}); reportSize(); }
  function render(sc){
    var root=document.getElementById("root");
    if(!sc||!Array.isArray(sc.cells)||sc.cells.length===0){root.innerHTML='<div class="empty">No cells to display.</div>';reportSize();return;}
    var groups={},order=[];
    sc.cells.forEach(function(c){var s=c.section||"";if(!(s in groups)){groups[s]=[];order.push(s);}groups[s].push(c);});
    var html="";
    order.forEach(function(s){
      if(s) html+="<h3>"+esc(s)+"</h3>";
      html+="<table><thead><tr><th>name</th><th>formula</th><th>result</th></tr></thead><tbody>";
      groups[s].forEach(function(c){
        var e=!!c.isError;
        html+='<tr class="'+(e?"err":"")+'"><td>'+esc(c.name)+"</td><td>"+esc(c.formula)+'</td><td class="result '+(e?"err":"")+'">'+esc(c.result)+"</td></tr>";
      });
      html+="</tbody></table>";
    });
    root.innerHTML=html;
    reportSize();
  }
  // First "text" content item of the CallToolResult (the markdown table).
  function extractMarkdown(p){
    var lists=[p.content,p.result&&p.result.content,p.toolResult&&p.toolResult.content];
    for(var i=0;i<lists.length;i++){
      var c=lists[i];
      if(Array.isArray(c)){
        for(var j=0;j<c.length;j++){ if(c[j]&&c[j].type==="text"&&typeof c[j].text==="string") return c[j].text; }
      }
    }
    return "";
  }
  // Fallback when the host strips structuredContent: rebuild cells from the
  // markdown. Sections are "## Heading" lines (attribute suffixes like
  // "@precision:50" stripped); each table's first row is the header, "|---|"
  // rows are separators; error cells render as "#ERROR: <code>".
  function parseMarkdownCells(md){
    var cells=[],section="",inTable=false,row=0;
    String(md||"").split(/\r?\n/).forEach(function(line){
      var t=line.trim();
      if(/^#+\s/.test(t)){section=t.replace(/^#+\s*/,"").split(" @")[0].trim();inTable=false;return;}
      if(t.charAt(0)!=="|"){inTable=false;return;}
      if(!inTable){inTable=true;row=0;}
      row++;
      if(row===1)return;
      var parts=t.split("|").slice(1,-1).map(function(x){return x.trim();});
      if(parts.length<2)return;
      if(parts.every(function(x){return /^:?-+:?$/.test(x);}))return;
      var name=parts[0],formula=parts.length>=3?parts[1]:"",result=parts[parts.length-1];
      if(!name&&!formula&&!result)return;
      cells.push({name:name,formula:formula,result:result,section:section,isError:result.indexOf("#ERROR")===0});
    });
    return cells;
  }
  window.addEventListener("message",function(ev){
    var m=ev.data||{};
    // The only request we send is ui/initialize, so any JSON-RPC response —
    // result OR error — means the host answered -> announce readiness.
    if(m && m.method===undefined && (m.result!==undefined||m.error!==undefined)){ announceReady(); return; }
    var meth=(m&&m.method)||"";
    if((meth==="ui/notifications/tool-result"||meth.indexOf("tool-result")>=0)&&m.params){
      var p=m.params;
      var sc=p.structuredContent||(p.result&&p.result.structuredContent)||(p.toolResult&&p.toolResult.structuredContent)||p;
      if(!sc||!Array.isArray(sc.cells)||sc.cells.length===0){
        var parsed=parseMarkdownCells(extractMarkdown(p));
        if(parsed.length){render({cells:parsed});return;}
      }
      render(sc);
    }
  });
  // MCP Apps handshake (SEP-1865 2026-01-26): apps identify with appInfo (the
  // clientInfo shape is schema-invalid and rejected by Claude web/Desktop).
  send({jsonrpc:"2.0",id:1,method:"ui/initialize",params:{protocolVersion:"2026-01-26",appInfo:{name:"folio-table",version:"1"},appCapabilities:{}}});
  try{ new ResizeObserver(function(){reportSize();}).observe(document.body); }catch(e){}
  reportSize();
  setTimeout(announceReady,1000);
</script>
</body>
</html>
